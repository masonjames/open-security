name: node-package-verification

on:
  push:
    tags:
      - "npm-v*"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

# This workflow deliberately stops at a verified package artifact. Publishing
# to npm requires a separate, explicitly authorized release process.
jobs:
  verify:
    name: verify-package
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"

      - name: Enable pnpm
        shell: bash
        run: corepack enable && corepack prepare "$(node -p 'require("./sdk/typescript/package.json").packageManager')" --activate

      - name: Validate package tag
        if: startsWith(github.ref, 'refs/tags/npm-v')
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$GITHUB_REF_NAME" =~ ^npm-v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Package tags must identify a stable version, such as npm-v0.1.0." >&2
            exit 1
          fi
          version="${GITHUB_REF_NAME#npm-v}"
          package_version="$(node -p 'require("./sdk/typescript/package.json").version')"
          if [[ "$version" != "$package_version" ]]; then
            echo "Package tag $version must match package version $package_version." >&2
            exit 1
          fi
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Package tags must point to a commit on main." >&2
            exit 1
          fi

      - name: Install dependencies
        run: pnpm --dir sdk/typescript install --frozen-lockfile

      - name: Verify
        run: |
          pnpm --dir sdk/typescript run types
          pnpm --dir sdk/typescript run test
          pnpm --dir sdk/typescript run format
          pnpm --dir sdk/typescript run build

      - name: Pack
        working-directory: sdk/typescript
        shell: bash
        run: |
          set -euo pipefail
          npm pkg set "gitHead=$GITHUB_SHA"
          pnpm pack --pack-destination ../../dist

      - name: Inspect and smoke test package
        working-directory: sdk/typescript
        shell: bash
        env:
          CODEX_SECURITY_EXPECTED_GIT_HEAD: ${{ github.sha }}
        run: pnpm run check:package ../../dist/*.tgz

      - name: Upload verified package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: open-security-package-${{ github.sha }}
          path: dist/*.tgz
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
